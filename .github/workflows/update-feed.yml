name: Update X Feed

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python vorbereiten
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests


      - name: FxTwitter Einzelpost testen
        run: |
          python - <<'PY'
          import requests
          import json
      
          username = "Twitch_Lurmii"
          tweet_id = "2091762397446820319"
      
          url = f"https://api.fxtwitter.com/{username}/status/{tweet_id}"
      
          print("=" * 60)
          print("Teste FxTwitter Einzelpost")
          print("=" * 60)
          print("URL:", url)
      
          response = requests.get(
              url,
              timeout=30,
          )
      
          print("HTTP Status:", response.status_code)
          print("Antwortgröße:", len(response.content))
      
          try:
              data = response.json()
      
              print("")
              print(json.dumps(
                  data,
                  indent=2,
                  ensure_ascii=False
              )[:15000])
      
          except Exception:
              print(response.text[:5000])
      
          if response.status_code != 200:
              raise SystemExit("❌ FxTwitter-Test fehlgeschlagen")
      
          print("")
          print("✅ FxTwitter Einzelpost funktioniert")
          PY
      - name: FxTwitter Timeline testen
        run: |
          python - <<'PY'
          import requests
          import json
      
          username = "Twitch_Lurmii"
      
          urls = [
              f"https://api.fxtwitter.com/user/{username}",
              f"https://api.fxtwitter.com/profile/{username}",
              f"https://api.fxtwitter.com/{username}",
          ]
      
          print("=" * 60)
          print("Teste FxTwitter Profil/Timeline")
          print("=" * 60)
      
          for url in urls:
              print("")
              print("Teste:", url)
      
              try:
                  response = requests.get(
                      url,
                      timeout=30,
                  )
      
                  print("HTTP:", response.status_code)
                  print("Größe:", len(response.content))
      
                  if response.status_code == 200:
                      try:
                          data = response.json()
                          print(
                              json.dumps(
                                  data,
                                  indent=2,
                                  ensure_ascii=False
                              )[:5000]
                          )
                      except Exception:
                          print(response.text[:2000])
      
              except Exception as e:
                  print("Fehler:", e)
          PY


      - name: RSS-Feeds und Bilder erstellen
        run: |
          python bot.py
          python bot_confusion.py
          python bot_lurmii.py

      - name: RSS-Dateien und Bilder speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add *.xml images/

          if git diff --cached --quiet; then
            echo "Keine Änderungen an RSS-Dateien oder Bildern."
          else
            git commit -m "Update RSS feed and images"
            git push
          fi

      - name: Auf GitHub Pages warten
        run: |
          echo "Warte 60 Sekunden auf die Veröffentlichung der Bilder ..."
          sleep 60

      - name: Discord-Posts senden
        env:
          DISCORD_WEBHOOK_MOSCHT: ${{ secrets.DISCORD_WEBHOOK_MOSCHT }}
          DISCORD_WEBHOOK_CONFUSION: ${{ secrets.DISCORD_WEBHOOK_CONFUSION }}
          DISCORD_WEBHOOK_LURMII: ${{ secrets.DISCORD_WEBHOOK_LURMII }}
        run: |
          python discord_poster.py

      - name: Discord-Status speichern
        run: |
          git add last_posts.json

          if git diff --cached --quiet; then
            echo "Keine Änderungen an last_posts.json."
          else



            git commit -m "Update Discord state"
            git push
          fi
