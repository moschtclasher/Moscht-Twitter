name: Test X API

on:
  workflow_dispatch:

jobs:
  test-sorsa:
    runs-on: ubuntu-latest

    steps:
      - name: Sorsa API testen
        env:
          SORSA_API_KEY: ${{ secrets.SORSA_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          api_key = os.environ["SORSA_API_KEY"]

          url = "https://api.sorsa.io/v3/search-tweets"

          headers = {
              "ApiKey": api_key,
              "Content-Type": "application/json",
          }

          data = {
              "query": "from:Twitch_Lurmii",
              "order": "latest",
          }

          response = requests.post(
              url,
              headers=headers,
              json=data,
              timeout=30,
          )

          print("HTTP Status:", response.status_code)
          print("Antwortgröße:", len(response.text))

          if response.status_code != 200:
              print(response.text)
              raise SystemExit(1)

          result = response.json()

          tweets = result.get("tweets", [])

          print("")
          print("Anzahl Tweets:", len(tweets))
          print("")

          for tweet in tweets[:5]:
              print("=" * 60)
              print("ID:", tweet.get("id"))
              print("Datum:", tweet.get("created_at"))
              print("Autor:", tweet.get("user", {}).get("username"))
              print("Text:", tweet.get("full_text"))
              print("Medien:", tweet.get("media"))
          PY
