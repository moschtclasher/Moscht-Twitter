name: Test X API

on:
  workflow_dispatch:

jobs:
  test-sorsa:
    runs-on: ubuntu-latest

    steps:
      - name: FxTwitter testen
        run: |
          python - <<'PY'
          import requests
          import json
      
          username = "Twitch_Lurmii"
      
          url = f"https://api.fxtwitter.com/2/user/{username}/tweets"
      
          print("=" * 60)
          print("Teste FxTwitter")
          print("=" * 60)
          print("URL:", url)
      
          response = requests.get(
              url,
              timeout=30,
          )
      
          print("HTTP Status:", response.status_code)
          print("Antwortgröße:", len(response.content))
      
          print("")
          print("Antwort:")
      
          try:
              data = response.json()
              print(json.dumps(data, indent=2, ensure_ascii=False)[:10000])
          except Exception:
              print(response.text[:5000])
      
          if response.status_code != 200:
              raise SystemExit("❌ FxTwitter-Test fehlgeschlagen")
      
          print("")
          print("✅ FxTwitter antwortet")
          PY
