#!/usr/bin/env python3
"""Prüft einen X-Account auf neue Posts/Reposts und sendet sie per Webhook nach Discord.

Benötigte Umgebungsvariablen (in GitHub als Secrets/Variables hinterlegen):
  X_BEARER_TOKEN        (Secret)   Bearer-Token der X-API
  DISCORD_WEBHOOK_URL   (Secret)   Discord-Webhook-URL
  X_USERNAME            (Variable) Account-Name ohne @
Optional:
  INCLUDE_REPLIES       "true" = Antworten auch senden (Standard: false)
"""
import json
import os
import sys
import time
import urllib.error
import urllib.parse
import urllib.request

STATE_FILE = "state.json"
API = "https://api.x.com/2"
MAX_PER_RUN = 20  # Schutz gegen Flut, falls lange nichts lief


def env(name, required=True, default=""):
    value = os.environ.get(name, default).strip()
    if required and not value:
        sys.exit(f"Fehlende Umgebungsvariable: {name}")
    return value


def http(url, headers=None, data=None, method=None):
    body = json.dumps(data).encode() if data is not None else None
    req = urllib.request.Request(url, data=body, method=method)
    req.add_header("User-Agent", "x-to-discord/1.0")
    for k, v in (headers or {}).items():
        req.add_header(k, v)
    if body is not None:
        req.add_header("Content-Type", "application/json")
    with urllib.request.urlopen(req, timeout=30) as resp:
        raw = resp.read()
        return json.loads(raw) if raw else {}


def x_get(path, params, token):
    url = f"{API}{path}?{urllib.parse.urlencode(params)}"
    return http(url, headers={"Authorization": f"Bearer {token}"})


def load_state():
    try:
        with open(STATE_FILE, encoding="utf-8") as f:
            return json.load(f)
    except (FileNotFoundError, json.JSONDecodeError):
        return {}


def save_state(state):
    with open(STATE_FILE, "w", encoding="utf-8") as f:
        json.dump(state, f, indent=2)
        f.write("\n")


def fetch_new_posts(user_id, since_id, token, include_replies):
    params = {
        "max_results": 100 if since_id else 5,
        "tweet.fields": "created_at,referenced_tweets,attachments,entities",
        "expansions": "referenced_tweets.id,referenced_tweets.id.author_id,"
                      "attachments.media_keys",
        "user.fields": "username,name,profile_image_url",
        "media.fields": "url,preview_image_url,type",
    }
    if not include_replies:
        params["exclude"] = "replies"
    if since_id:
        params["since_id"] = since_id
    return x_get(f"/users/{user_id}/tweets", params, token)


# ----------------------------------------------------------------------
# FORMAT: Hier wird der Discord-Beitrag gebaut. Passe diesen Teil an dein
# gewünschtes Format an (oder schick mir dein Beispiel, dann baue ich es um).
# ----------------------------------------------------------------------
def build_message(post, includes, me):
    users = {u["id"]: u for u in includes.get("users", [])}
    refs = {t["id"]: t for t in includes.get("tweets", [])}
    media = {m["media_key"]: m for m in includes.get("media", [])}

    text = post.get("text", "")
    kind = "post"
    source = post
    author = me
    for ref in post.get("referenced_tweets", []):
        original = refs.get(ref["id"])
        if ref["type"] == "retweeted" and original:
            kind, source = "repost", original
            author = users.get(original.get("author_id"), me)
            text = original.get("text", text)
        elif ref["type"] == "quoted":
            kind = "quote"

    url = f"https://x.com/{me['username']}/status/{post['id']}"
    title = {
        "post": f"Neuer Post von @{me['username']}",
        "repost": f"@{me['username']} hat @{author['username']} repostet",
        "quote": f"@{me['username']} hat zitiert",
    }[kind]

    embed = {
        "title": title,
        "url": url,
        "description": text[:4000],
        "color": 0x1D9BF0,
        "timestamp": post.get("created_at"),
        "author": {
            "name": f"{author['name']} (@{author['username']})",
            "url": f"https://x.com/{author['username']}",
            "icon_url": author.get("profile_image_url", ""),
        },
        "footer": {"text": "X"},
    }
    for key in source.get("attachments", {}).get("media_keys", []):
        m = media.get(key, {})
        img = m.get("url") or m.get("preview_image_url")
        if img:
            embed["image"] = {"url": img}
            break
    return {"embeds": [embed]}


def send_discord(webhook, payload):
    for attempt in range(5):
        try:
            http(webhook, data=payload, method="POST")
            return
        except urllib.error.HTTPError as e:
            if e.code == 429:
                wait = float(e.headers.get("Retry-After", "2"))
                time.sleep(min(wait, 30) + 0.5)
                continue
            raise
    sys.exit("Discord: zu viele Rate-Limit-Antworten, Abbruch.")


def main():
    token = env("X_BEARER_TOKEN")
    webhook = env("DISCORD_WEBHOOK_URL")
    username = env("X_USERNAME").lstrip("@")
    include_replies = env("INCLUDE_REPLIES", False, "false").lower() == "true"

    state = load_state()

    # User-ID nur einmal abfragen und speichern (spart API-Kosten)
    if state.get("username") != username or "user_id" not in state:
        data = x_get(f"/users/by/username/{username}",
                     {"user.fields": "name,username,profile_image_url"}, token)
        if "data" not in data:
            sys.exit(f"Account nicht gefunden: {data}")
        state = {"username": username, "user_id": data["data"]["id"]}
        state["profile"] = data["data"]

    me = state["profile"]
    since_id = state.get("last_id")
    data = fetch_new_posts(state["user_id"], since_id, token, include_replies)
    posts = data.get("data", [])
    includes = data.get("includes", {})

    if not posts:
        print("Keine neuen Posts.")
        save_state(state)
        return

    posts.sort(key=lambda p: int(p["id"]))  # älteste zuerst
    newest = posts[-1]["id"]

    if not since_id:
        # Erster Lauf: nur Startpunkt merken, nichts senden
        print("Erster Lauf: Startpunkt gesetzt, es wird nichts gesendet.")
        state["last_id"] = newest
        save_state(state)
        return

    to_send = posts[-MAX_PER_RUN:]
    for post in to_send:
        send_discord(webhook, build_message(post, includes, me))
        state["last_id"] = post["id"]
        save_state(state)  # nach jedem Senden sichern
        time.sleep(1)
    state["last_id"] = newest
    save_state(state)
    print(f"{len(to_send)} Post(s) gesendet.")


if __name__ == "__main__":
    main()
